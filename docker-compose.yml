version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: 13c-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-13csecret123}
      POSTGRES_DB: ${POSTGRES_DB:-13c_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 13C Backend Core & Blockchain Watchers
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 13c-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      SERVER_PORT: "8080"
      DB_DRIVER: postgres
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-13csecret123}@postgres:5432/${POSTGRES_DB:-13c_db}?sslmode=disable"
      MASTER_SECRET_KEY: ${MASTER_SECRET_KEY:-13c-production-master-secret-key-32bytes!}
      INVOICE_EXPIRY_MINUTES: "30"
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org/}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-rpc.com/}
      TRON_GRID_URL: ${TRON_GRID_URL:-https://api.trongrid.io}
      TRON_API_KEY: ${TRON_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
    ports:
      - "8080:8080"

volumes:
  postgres_data:

